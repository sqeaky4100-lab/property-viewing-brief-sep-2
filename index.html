<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Viewing Brief</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --card: #121a2b;
          --text: #e5e7eb;
          --muted: #9ca3af;
          --accent: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        width: min(760px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: clamp(1.6rem, 2vw + 1rem, 2.2rem);
      }
      p { color: var(--muted); line-height: 1.6; }
      .pill {
        display: inline-block;
        margin-top: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 15%, transparent);
        color: var(--accent);
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Property Viewing Brief</h1>
      <p>
        This project is now configured with a deployable static entrypoint so Vercel can serve
        content from the root route instead of returning a 404.
      </p>
      <span class="pill">Deployment Check Page</span>
    </main>
  </body>
</html>
